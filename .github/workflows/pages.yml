name: Code Coverage → GitHub Pages

on:
  push:
    branches: [base-scaffolding, analyzer-scaffolding]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          use-mamba: true
          activate-environment: my-python-buddy

      - name: Run Django tests and generate coverage HTML
        shell: bash -l {0}
        run: |
          coverage run manage.py test
          coverage html -d coverage_html
          mkdir -p site/code_coverage_report
          mv coverage_html/* site/code_coverage_report/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
