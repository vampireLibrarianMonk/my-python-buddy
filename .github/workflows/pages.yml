name: Code Coverage → GitHub Pages

on:
  push:
    branches: [base-scaffolding]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Conda (Miniforge + mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: false
          activate-environment: my-python-buddy
          environment-file: environment.yml
          channel-priority: strict

      - name: Verify env
        shell: bash -l {0}
        run: |
          conda info
          conda list python | sed -n '1,5p'

      - name: Run tests with coverage & build HTML site
        shell: bash -l {0}
        run: |
          coverage run -m pytest
          coverage html -d coverage_html
          touch coverage_html/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage_html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
