name: Code Coverage → GitHub Pages

on:
  push:
    branches: [base-scaffolding, analyzer-scaffolding]
    paths:
      - ".github/workflows/pages.yml"
      - "base_application/tests/**"
      - "core/**"
      - "environment.yml"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set up conda from the environment.yml
      - name: Setup Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: false
          activate-environment: my-python-buddy
          environment-file: environment.yml
          channel-priority: strict

      # Run Django tests under coverage and build the HTML report
      - name: Test with Django + build coverage HTML
        shell: bash -l {0}
        run: |
          coverage run manage.py test
          coverage html -d coverage_html
          touch coverage_html/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload coverage site
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage_html
          upload-dir: code_coverage_report

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
