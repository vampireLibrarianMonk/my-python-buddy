name: Coverage → GitHub Pages

on:
  push:
    branches: [base-scaffolding]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # miniforge a lightweight alternative
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: my-python-buddy
          environment-file: environment.yml
          python-version: 3.10
          auto-activate-base: false

      - name: Verify conda env
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: Run tests with coverage & build HTML site
        shell: bash -l {0}
        run: |
          coverage run -m pytest
          coverage html -d coverage_html
          touch coverage_html/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage_html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
