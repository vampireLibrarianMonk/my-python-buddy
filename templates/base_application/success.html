{% extends "base.html" %}
{% block title %}Upload complete · my-python-buddy{% endblock %}

{% block content %}
  <h1>Upload complete</h1>

  <div class="card">
    <p>Your file <strong>{{ file_name }}</strong> was uploaded.</p>
    <p><a class="link" href="{{ file_url }}" target="_blank" rel="noopener">View/Download</a></p>

    <div class="actions">
      <a class="btn" href="/">Upload another file</a>
      {% if sha256 %}
        <a class="btn" href="{% url 'analyze_file' sha256 %}">Analyze</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
